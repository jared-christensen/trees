version: 2

project_name: trees

builds:
  - id: trees
    main: ./cmd/trees
    binary: trees
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"

brews:
  - name: trees
    repository:
      owner: jared-christensen
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/jared-christensen/trees
    description: List, clean, create and switch git worktrees
    license: MIT
    dependencies:
      - name: git
    test: |
      system "#{bin}/trees", "--help"

release:
  github:
    owner: jared-christensen
    name: trees
